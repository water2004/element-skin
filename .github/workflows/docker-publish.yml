name: Docker Publish

on:
  push:
    branches: [ 'dev' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 提前启用 Node.js 24 以消除 Node.js 20 弃用警告
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  backend-quality:
    name: Backend quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: '12345678'
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      ADMIN_DATABASE_DSN: postgresql://postgres:12345678@localhost:5432/postgres?sslmode=disable
      REDIS_TEST_ADDR: localhost:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: skin-backend/go.mod
          cache-dependency-path: skin-backend/go.sum

      - name: Vet backend
        working-directory: skin-backend
        run: go vet ./...

      - name: Test backend with global coverage
        working-directory: skin-backend
        shell: bash
        run: |
          set -euo pipefail
          coverage_profile="$RUNNER_TEMP/backend-coverage.out"
          go test -p 2 -count=1 ./... \
            -coverpkg=./... \
            -covermode=atomic \
            -coverprofile="$coverage_profile"

          coverage_line="$(go tool cover -func="$coverage_profile" | tail -n 1)"
          actual="$(awk '{ value=$3; gsub(/%/, "", value); print value }' <<< "$coverage_line")"
          required='90.0'
          echo "Backend coverage: ${actual}% (required: ${required}%)"
          echo "### Backend coverage: ${actual}% / ${required}%" >> "$GITHUB_STEP_SUMMARY"
          if ! awk -v actual="$actual" -v required="$required" 'BEGIN { exit !((actual + 0) >= (required + 0)) }'; then
            echo "Backend coverage ${actual}% is below ${required}%" >&2
            exit 1
          fi

  build-and-push:
    needs: backend-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check build trigger
        id: trigger-check
        shell: bash
        run: |
          should_build=false

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            should_build=true
          elif [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            case "${GITHUB_REF_NAME}" in
              dev)
                should_build=true
                ;;
            esac
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            git fetch origin main --depth=1
            if git branch -r --contains "$GITHUB_SHA" | grep -q "origin/main"; then
              should_build=true
            else
              echo "Tag is not on main. Skipping build."
            fi
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: steps.trigger-check.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: steps.trigger-check.outputs.should_build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        if: steps.trigger-check.outputs.should_build == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=main,enable=${{ github.ref_type == 'tag' && steps.trigger-check.outputs.should_build == 'true' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && steps.trigger-check.outputs.should_build == 'true' }}

      - name: Build and push Docker image
        id: build-and-push
        if: steps.trigger-check.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: skin-backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_MODE=standard

  release:
    name: Publish GitHub Release
    needs: backend-quality
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main
        id: verify
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag is not on main. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.verify.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Element Skin ${{ github.ref_name }}
          body_path: RELEASE.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
